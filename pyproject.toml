[project]
name = "mau-mau-bot"
version = "0.0.0"
description = "Telegram bot to play UNO in group chats"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[http2,job-queue,rate-limiter]==22.8",
    "pony==0.7.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
